# Tooling configuration only. This repository is not an installable Python
# package: the patcher and scripts run straight from a checkout.

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Selected explicitly, so a ruff upgrade cannot silently change what CI gates.
# pycodestyle (E, W), pyflakes (F) and bugbear (B): correctness, not formatting.
select = ["E", "F", "W", "B"]
ignore = [
    "E501",  # line length: 123 existing long lines; reflowing published source is churn
    "E701",  # compact `if x: y` one-liners in data/loanspell/gen_java.py: style only
    "E702",  # `a; b` one-liners in gen_java.py, rename_apk.py and one test: style only
    "E741",  # the short name `l` in existing line-parsing code: style only
]
